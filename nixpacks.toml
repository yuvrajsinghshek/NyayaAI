[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python3.11 -m pip install -r requirements.txt --break-system-packages",
  "python3.11 -m pip install -e . --break-system-packages"
]

[start]
cmd = "python3.11 -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
